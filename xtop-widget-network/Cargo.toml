[package]
name = "xtop-widget-network"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Network widget for the xtop TUI: per-interface rate rows and RX/TX history"
repository = "https://github.com/xtop-cli/widgets"

[dependencies]
ratatui.workspace = true
xtop-plugin-api.workspace = true
serde_json.workspace = true
xtop-widget-api.workspace = true
xtop-widget-core = { path = "../xtop-widget-core" }

[dev-dependencies]
xtop-widget-core = { path = "../xtop-widget-core", features = ["testkit"] }
