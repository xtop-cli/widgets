[package]
name = "xtop-widget-blocks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Alternate widget pack for xtop: compact per-core gauges with ASCII fill labels"
repository = "https://github.com/xtop-cli/widgets"

[dependencies]
ratatui.workspace = true
serde_json = "1"
xtop-plugin-api.workspace = true
xtop-widget-api.workspace = true
xtop-widget-core = { path = "../../xtop-widget-core" }

[dev-dependencies]
xtop-widget-core = { path = "../../xtop-widget-core", features = ["testkit"] }
